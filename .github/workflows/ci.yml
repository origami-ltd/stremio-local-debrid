name: Tests
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:locales
      - run: npm run build:docs
      - run: git diff --exit-code -- docs public/locales public/configure
      - run: npm test
      - if: runner.os == 'Windows'
        run: node scripts/check-windows-startup.mjs
